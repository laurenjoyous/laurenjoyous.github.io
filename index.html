
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>같은 카페, 서로 다른 생각</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="screen">

    <!-- 카페 배경 -->
    <img
      src="image/cafe-background.png"
      class="cafe-background"
      alt="카페 배경"
    >

    <!-- 첫 번째 장면 -->
    <div class="scene-text scene-1">
      <img
        src="image/title.png"
        class="title-image"
        alt="같은 카페, 서로 다른 생각"
      >
      <img
        src="image/subtitle.png"
        class="subtitle-image"
        alt="우리는 같은 공간을 어떻게 다르게 사용하고 있을까요?"
      >
    </div>

    <!-- 두 번째 장면 -->
    <div class="scene-text scene-2">
      <img
        src="image/title-2.png"
        class="title-image"
        alt="카페, 제3의 공간"
      >
      <img
        src="image/subtitle-2.png"
        class="subtitle-image"
        alt="카페는 단순한 음료 소비 공간을 넘어 일상적인 생활 공간이 되었어요"
      >
    </div>

    <!-- 기존 스크롤 안내 -->
    <img
      src="image/scroll-guide.png"
      class="scroll-guide"
      alt="Scroll to Explore"
    >

    <!-- 새로운 클릭 안내 -->
    <img
      src="image/click-guide.png"
      class="click-guide"
      alt="Click the Background"
    >

    <!-- 오른쪽 설명 그래픽 -->
    <div class="why-cafe-group">

      <img
        src="image/why-cafe.png"
        class="why-cafe-title"
        alt="왜 카페일까요?"
      >

      <img
        src="image/circle-location.png"
        class="circle circle-location"
        alt="쉽게 접근 가능한 위치"
      >

      <img
        src="image/circle-open.png"
        class="circle circle-open"
        alt="자유롭고 열린 분위기"
      >

      <img
        src="image/circle-flexible.png"
        class="circle circle-flexible"
        alt="다양한 목적에 맞는 유연성"
      >

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
